ettings":"IPAP / VT, EPAP, RR, Ti, Rise Time","alarms":"HPL, Low Tidal Volume, Low VE, Apnea Time,Disconnect time","measurements":"Vte, set RR, total RR , PIP, MAP, VE, PEEP, FiO2, I:E，Temp, cuff","assessment":"Breath Sound (BS), Secretion Quality (平日至少 1次/日),SpO2 (每筆紀錄必填)"},{"group":"非侵襲性呼吸器","device":"ResMed Astral 150","mode":"P-SIMV / V-SIMV","settings":"IPAP / VT, EPAP, RR, Ti, PS, Rise Time","alarms":"HPL, Low Tidal Volume, Low VE, Apnea Time,Disconnect time","measurements":"Vte, set RR, total RR , PIP, MAP, VE, PEEP, FiO2, I:E，Temp, cuff","assessment":"Breath Sound (BS), Secretion Quality (平日至少 1次/日),SpO2 (每筆紀錄必填)"},{"group":"非侵襲性呼吸器","device":"ResMed Astral 150","mode":"iVAPS","settings":"Target Va, Target VT, Min/Max PS, EPAP, Target Rate","alarms":"HPL, Low Tidal Volume, Low VE, Apnea Time,Disconnect time","measurements":"set Vti, Vte, set RR, total RR , PIP, MAP, VE, PEEP, FiO2, I:E，Temp, cuff","assessment":"Breath Sound (BS), Secretion Quality (平日至少 1次/日),SpO2 (每筆紀錄必填)"}];

const unique = arr => [...new Set(arr)];
const splitItems = value =>
  String(value || "")
    .split(/[,，]/)
    .map(x => x.trim())
    .filter(Boolean);

let currentGroup = unique(DATA.map(x => x.group))[0];
let currentDevice = "";
let currentMode = "";

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function makeButton(text, active, click){
  const button = document.createElement("button");
  button.textContent = text;
  if(active) button.classList.add("active");
  button.addEventListener("click", click);
  return button;
}

function getDevices(){
  return unique(
    DATA
      .filter(x => x.group === currentGroup)
      .map(x => x.device)
  );
}

function getModes(){
  return unique(
    DATA
      .filter(x =>
        x.group === currentGroup &&
        x.device === currentDevice
      )
      .map(x => x.mode)
  );
}

function renderCategories(){
  const box = document.getElementById("categoryButtons");
  box.innerHTML = "";

  unique(DATA.map(x => x.group)).forEach(group => {
    box.appendChild(
      makeButton(group, group === currentGroup, () => {
        currentGroup = group;
        currentDevice = "";
        currentMode = "";
        renderAll();
      })
    );
  });
}

function renderDevices(){
  const devices = getDevices();

  if(!devices.includes(currentDevice)){
    currentDevice = devices[0] || "";
  }

  const select = document.getElementById("deviceSelect");
  select.innerHTML = "";

  devices.forEach(device => {
    select.add(new Option(device, device));
  });

  select.value = currentDevice;

  select.onchange = e => {
    currentDevice = e.target.value;
    currentMode = "";
    renderModes();
    renderResult();
  };

  const buttonBox = document.getElementById("deviceButtons");
  buttonBox.innerHTML = "";

  devices.forEach(device => {
    buttonBox.appendChild(
      makeButton(device, device === currentDevice, () => {
        currentDevice = device;
        currentMode = "";
        renderDevices();
        renderModes();
        renderResult();
      })
    );
  });
}

function renderModes(){
  const modes = getModes();

  if(!modes.includes(currentMode)){
    currentMode = modes[0] || "";
  }

  const select = document.getElementById("modeSelect");
  select.innerHTML = "";

  modes.forEach(mode => {
    select.add(new Option(mode, mode));
  });

  select.value = currentMode;

  select.onchange = e => {
    currentMode = e.target.value;
    renderModes();
    renderResult();
  };

  const buttonBox = document.getElementById("modeButtons");
  buttonBox.innerHTML = "";

  modes.forEach(mode => {
    buttonBox.appendChild(
      makeButton(mode, mode === currentMode, () => {
        currentMode = mode;
        renderModes();
        renderResult();
      })
    );
  });
}

function tags(value){
  const items = splitItems(value);

  if(items.length === 0){
    return '<span class="tag">尚無資料</span>';
  }

  return items
    .map(item =>
      '<span class="tag">' + escapeHtml(item) + '</span>'
    )
    .join("");
}

function renderResult(){
  const row = DATA.find(x =>
    x.group === currentGroup &&
    x.device === currentDevice &&
    x.mode === currentMode
  );

  const result = document.getElementById("result");

  if(!row){
    result.innerHTML =
      '<div class="empty">目前沒有相對應的呼吸器資料</div>';
    return;
  }

  result.innerHTML = `
    <div class="result-header">
      <h2>${escapeHtml(row.device)}</h2>
      <p>
        通氣模式：
        <b>${escapeHtml(row.mode)}</b>
        ｜ ${escapeHtml(row.group)}
      </p>
    </div>

    <div class="info-grid">

      <div class="info-card settings">
        <h3>⚙️ 呼吸器設定值<br>(Control Settings)</h3>
        ${tags(row.settings)}
      </div>

      <div class="info-card alarms">
        <h3>🔔 警示設定<br>(Alarm Limits)</h3>
        ${tags(row.alarms)}
      </div>

      <div class="info-card measurements">
        <h3>📊 臨床監測數據<br>(Measurements)</h3>
        <div class="text-box">
${escapeHtml(row.measurements || "尚無資料")}
        </div>
      </div>

      <div class="info-card assessment">
        <h3>🩺 理學與臨床評估<br>(Physical Assessment)</h3>
        <div class="text-box">
${escapeHtml(row.assessment || "尚無資料")}
        </div>
      </div>

    </div>

    <div class="data-note">
      已載入呼吸器主資料庫，共 ${DATA.length} 筆 Device × Mode 對照資料
    </div>
  `;
}

function renderAll(){
  renderCategories();
  renderDevices();
  renderModes();
  renderResult();
}

renderAll();
</script>
